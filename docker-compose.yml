services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-vendas-app
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3333}
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST_DOCKER:-postgres}
      DB_PORT: ${DB_PORT_DOCKER:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: ${REDIS_HOST_DOCKER:-redis}
      REDIS_PORT: ${REDIS_PORT_DOCKER:-6379}
      DB_HOST_DOCKER: postgres
      DB_PORT_DOCKER: 5432
      REDIS_HOST_DOCKER: redis
      REDIS_PORT_DOCKER: 6379
      DOCKER_CONTAINER: true
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: db_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
